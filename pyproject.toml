[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-rag"
version = "0.1.0"
description = "A modular, pluggable RAG system with MCP server support"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "RAG Team", email = "team@example.com"}
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0",
    "chromadb>=0.4.0",
    "langchain>=0.1.0",
    "openai>=1.3.0",
    "markitdown>=0.0.1",
    "streamlit>=1.28.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.292",
    "mypy>=1.5.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
]
addopts = "--tb=short"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
