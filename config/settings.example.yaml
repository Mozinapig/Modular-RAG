# MCP RAG System Configuration

# LLM Configuration
llm:
  provider: openai  # azure | openai | ollama | deepseek
  model: gpt-4o-mini
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.openai.com/v1"
  temperature: 0.7

# Vision LLM Configuration (for image captioning)
vision_llm:
  provider: openai  # azure | openai
  model: gpt-4o-mini
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.openai.com/v1"
  max_image_size: 2048

# Embedding Configuration
embedding:
  provider: openai  # openai | azure | ollama
  model: text-embedding-3-small
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.openai.com/v1"
  dimensions: 1536

# Vector Store Configuration
vector_store:
  backend: chroma  # chroma | qdrant | pinecone
  persist_path: ./data/db/chroma

# Retrieval Configuration
retrieval:
  sparse_backend: bm25  # bm25 | elasticsearch
  fusion_algorithm: rrf  # rrf | weighted_sum
  top_k_dense: 20
  top_k_sparse: 20
  top_k_final: 10

# Splitter Configuration
splitter:
  provider: recursive  # recursive | semantic | fixed_length
  chunk_size: 1024
  chunk_overlap: 100

# Rerank Configuration
rerank:
  backend: none  # none | cross_encoder | llm
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_m: 30

# Evaluation Configuration
evaluation:
  backends: [custom]  # ragas | custom | deepeval
  golden_test_set: ./tests/fixtures/golden_test_set.json

# Observability Configuration
observability:
  enabled: true
  log_file: ./logs/traces.jsonl
  log_level: INFO
  detail_level: standard  # minimal | standard | verbose

# Dashboard Configuration
dashboard:
  enabled: true
  port: 8501
  traces_dir: ./logs
  auto_refresh: true
  refresh_interval: 5

# Ingestion Configuration
ingestion:
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false
  image_captioner:
    enabled: false
